<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StrangerChat - Talk to Strangers!</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header Bar */
    header { background: #111827; height: 60px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 1.3rem; color: #38bdf8; }
    .status-pill { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); font-size: 0.8rem; padding: 5px 12px; border-radius: 20px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }

    /* Main Container */
    .app-body { flex: 1; display: flex; flex-direction: row; height: calc(100vh - 60px); overflow: hidden; }
    @media (max-width: 768px) { .app-body { flex-direction: column; } }

    /* Video Section */
    .video-workspace { flex: 2; background: #030712; display: flex; flex-direction: column; position: relative; }
    .video-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; background: #030712; height: 100%; }
    @media (max-width: 768px) { .video-grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }

    .video-card { position: relative; background: #111827; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #1f2937; }
    video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    video.mirrored { transform: scaleX(-1); }
    
    .badge { position: absolute; top: 12px; left: 12px; background: rgba(0, 0, 0, 0.65); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1); z-index: 2; }

    /* Controls Bar */
    .controls-bar { background: #111827; padding: 12px 16px; display: flex; justify-content: center; align-items: center; gap: 12px; border-top: 1px solid #1f2937; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; font-size: 0.95rem; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-next { background: #ec4899; color: #ffffff; padding: 12px 32px; font-size: 1.1rem; }
    .btn-secondary { background: #374151; color: #f3f4f6; }
    .btn-secondary:hover { background: #4b5563; }

    /* Text Chat Section */
    .chat-workspace { flex: 1; min-width: 320px; background: #0d1322; display: flex; flex-direction: column; border-left: 1px solid #1f2937; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg.system { background: rgba(55, 65, 81, 0.5); color: #9ca3af; align-self: center; font-size: 0.8rem; text-align: center; width: 100%; border-radius: 8px; border: 1px dashed #374151; }
    .msg.you { background: #0284c7; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.stranger { background: #1f2937; color: #f3f4f6; align-self: flex-start; border-bottom-left-radius: 2px; }

    .chat-input-bar { padding: 12px; background: #111827; border-top: 1px solid #1f2937; display: flex; gap: 8px; }
    .chat-input-bar input { flex: 1; background: #030712; border: 1px solid #1f2937; padding: 10px 14px; border-radius: 8px; color: #fff; outline: none; font-size: 0.9rem; }
    .chat-input-bar input:focus { border-color: #38bdf8; }

    /* Overlay 18+ Rules Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 28px; max-width: 440px; width: 100%; text-align: center; }
    .modal-card h2 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 12px; }
    .modal-card p { font-size: 0.9rem; color: #9ca3af; margin-bottom: 20px; line-height: 1.5; }
  </style>
</head>
<body>

  <!-- 18+ Age Gate (Omegle / OmeTV Style) -->
  <div class="modal-overlay" id="ageModal">
    <div class="modal-card">
      <h2>Welcome to StrangerChat ⚡</h2>
      <p>You must be <strong>18 years or older</strong> to enter. Please treat strangers with respect and keep the platform safe!</p>
      <button class="btn btn-next" style="width:100%; justify-content:center;" onclick="acceptRules()">Start Chatting (18+)</button>
    </div>
  </div>

  <header>
    <a href="#" class="brand">⚡ StrangerChat</a>
    <div class="status-pill" id="statusPill">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>
  </header>

  <div class="app-body">
    <!-- Video Stream Section -->
    <div class="video-workspace">
      <div class="video-grid">
        <div class="video-card">
          <div class="badge">Stranger</div>
          <video id="remoteVideo" autoplay playsinline></video>
        </div>
        <div class="video-card">
          <div class="badge">You</div>
          <video id="localVideo" class="mirrored" autoplay playsinline muted></video>
        </div>
      </div>

      <div class="controls-bar">
        <button class="btn btn-next" id="nextBtn" onclick="nextPartner()">NEXT (Esc)</button>
        <button class="btn btn-secondary" id="muteAudioBtn" onclick="toggleMuteAudio()">Mute</button>
        <button class="btn btn-secondary" id="muteVideoBtn" onclick="toggleMuteVideo()">Stop Video</button>
      </div>
    </div>

    <!-- Text Chat Section -->
    <div class="chat-workspace">
      <div class="chat-messages" id="chatMessages">
        <div class="msg system">Welcome! Click "NEXT" to start matching with a stranger.</div>
      </div>

      <div class="chat-input-bar">
        <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button class="btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    let localStream = null;
    let peerConnection = null;
    let partnerId = null;

    // Built-in STUN and TURN Servers (Hidden from users)
    const iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun.metered.ca:80' },
      {
        urls: [
          "turn:global.relay.metered.ca:80",
          "turn:global.relay.metered.ca:443",
          "turn:global.relay.metered.ca:443?transport=tcp"
        ],
        username: "YOUR_METERED_USERNAME", // Paste your username here inside quotes
        credential: "YOUR_METERED_PASSWORD"  // Paste your password here inside quotes
      }
    ];

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');

    function acceptRules() {
      document.getElementById('ageModal').style.display = 'none';
      initCamera();
    }

    async function initCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, 
          audio: true 
        });
        localVideo.srcObject = localStream;
      } catch (err) {
        console.error("Camera error:", err);
        appendSystemMessage("Please allow camera and microphone access to start.");
      }
    }

    function nextPartner() {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      remoteVideo.srcObject = null;
      partnerId = null;

      updateStatus("Searching...", "#f59e0b");
      appendSystemMessage("Searching for a stranger...");

      socket.emit('find_partner');
    }

    socket.on('waiting_for_partner', () => {
      updateStatus("Waiting...", "#f59e0b");
    });

    socket.on('match_found', (data) => {
      partnerId = data.partnerId;
      updateStatus("Connected", "#10b981");
      appendSystemMessage("You are now chatting with a random stranger!");

      createPeerConnection(data.initiator);
    });

    socket.on('partner_left', () => {
      updateStatus("Disconnected", "#ef4444");
      appendSystemMessage("Stranger has disconnected.");
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      remoteVideo.srcObject = null;
    });

    socket.on('signal', async (data) => {
      if (!peerConnection) createPeerConnection(false);

      if (data.signal.sdp) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
        if (data.signal.sdp.type === 'offer') {
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.emit('signal', { target: partnerId, signal: { sdp: peerConnection.localDescription } });
        }
      } else if (data.signal.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
        } catch (e) {
          console.error("Candidate error:", e);
        }
      }
    });

    function createPeerConnection(isInitiator) {
      peerConnection = new RTCPeerConnection({ iceServers });

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }

      peerConnection.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
          remoteVideo.play().catch(e => console.log("Autoplay caught:", e));
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('signal', { target: partnerId, signal: { candidate: event.candidate } });
        }
      };

      if (isInitiator) {
        peerConnection.onnegotiationneeded = async () => {
          try {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('signal', { target: partnerId, signal: { sdp: peerConnection.localDescription } });
          } catch (err) {
            console.error("Offer error:", err);
          }
        };
      }
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !partnerId) return;

      socket.emit('send_message', { text });
      appendChatMessage(text, 'you');
      messageInput.value = '';
    }

    socket.on('receive_message', (data) => {
      appendChatMessage(data.text, 'stranger');
    });

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function appendChatMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg system';
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function updateStatus(text, color) {
      statusText.textContent = text;
      statusDot.style.background = color;
    }

    function toggleMuteAudio() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById('muteAudioBtn').textContent = track.enabled ? 'Mute' : 'Unmute';
      }
    }

    function toggleMuteVideo() {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById('muteVideoBtn').textContent = track.enabled ? 'Stop Video' : 'Start Video';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') nextPartner();
    });
  </script>
</body>
</html>
