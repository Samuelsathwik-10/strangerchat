<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StrangerChat – Talk to Strangers</title>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--line:#2a2e3d;--txt:#eef0f6;--mut:#8b90a3;--acc:#7c5cff;--red:#ff4d5e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 20px;font-weight:600;color:#fff;background:var(--acc)}
button.sec{background:var(--line)} button.red{background:var(--red)} button:disabled{opacity:.5}
#home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
#home h1{font-size:2.6rem} #home p{color:var(--mut);max-width:420px}
#home .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#app{display:none;height:100%;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700}
header small{color:var(--mut);font-weight:400}
main{flex:1;display:flex;min-height:0}
#videos{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px;min-width:0}
.box{position:relative;flex:1;background:#000;border-radius:12px;overflow:hidden;min-height:0}
.box video{width:100%;height:100%;background:#000}
#remote{object-fit:contain}
#local{object-fit:contain;transform:scaleX(-1)} /* mirrored selfie preview */
.tag{position:absolute;left:10px;top:10px;background:#0009;padding:4px 10px;border-radius:20px;font-size:.8rem}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);background:#000a;text-align:center;padding:20px}
#chat{width:340px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:85%;padding:8px 12px;border-radius:14px;word-wrap:break-word;font-size:.95rem}
.m.me{align-self:flex-end;background:var(--acc)} .m.them{align-self:flex-start;background:var(--line)}
.sys{align-self:center;color:var(--mut);font-size:.85rem}
#typing{height:18px;padding:0 12px;color:var(--mut);font-size:.8rem}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#msg{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font:inherit}
#ctrl{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)} #ctrl button{flex:1}
body.textonly #videos{display:none} body.textonly #chat{width:100%;border:0}
@media(max-width:800px){main{flex-direction:column} #chat{width:100%;height:42%;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="home">
  <h1>Stranger<span style="color:var(--acc)">Chat</span></h1>
  <p>Meet new people instantly. Chat by text or video with a random stranger. Be kind and stay safe — never share personal info.</p>
  <div class="row">
    <button onclick="start('text')">💬 Text Chat</button>
    <button onclick="start('video')">🎥 Video Chat</button>
  </div>
  <p style="font-size:.8rem">By continuing you confirm you are 18+ and agree to chat respectfully. <span id="cnt"></span></p>
</div>

<div id="app">
  <header><span>StrangerChat</span><small id="online"></small></header>
  <main>
    <section id="videos">
      <div class="box"><video id="remote" autoplay playsinline></video><span class="tag">Stranger</span><div id="status">Connecting…</div></div>
      <div class="box"><video id="local" autoplay playsinline muted></video><span class="tag">You</span></div>
    </section>
    <aside id="chat">
      <div id="log"></div><div id="typing"></div>
      <div id="bar"><input id="msg" placeholder="Type a message…" autocomplete="off" maxlength="1000"><button id="send">Send</button></div>
      <div id="ctrl"><button class="sec" id="next">Next</button><button class="sec" id="rep">Report</button><button class="red" id="stop">Stop</button></div>
    </aside>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
const socket=io();
let mode="text", localStream=null, pc=null, matched=false, typingTimer;
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};

socket.on("online",n=>{$("online").textContent=n+" online";$("cnt").textContent=n+" online"});

async function start(m){
  mode=m;
  document.body.classList.toggle("textonly",m==="text");
  if(m==="video"){
    try{
      localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
      $("local").srcObject=localStream;
    }catch(e){alert("Camera/microphone permission is required for video chat.");return;}
  }
  $("home").style.display="none";$("app").style.display="flex";
  findNext();
}
function sys(t){const d=document.createElement("div");d.className="m sys";d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9}
function add(t,me){const d=document.createElement("div");d.className="m "+(me?"me":"them");d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9}
function closePC(){if(pc){pc.ontrack=pc.onicecandidate=null;pc.close();pc=null}$("remote").srcObject=null}
function findNext(){
  closePC();matched=false;$("log").innerHTML="";$("typing").textContent="";
  $("status").style.display="flex";$("status").textContent="Looking for someone…";
  sys("Looking for someone to chat with…");
  socket.emit("find",mode);
}
function makePC(initiator){
  pc=new RTCPeerConnection(ICE);
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{if(e.candidate)socket.emit("signal",{candidate:e.candidate})};
  pc.ontrack=e=>{
    const r=$("remote");r.srcObject=e.streams[0];
    r.style.objectFit="contain"; // keep stranger's full frame visible
    $("status").style.display="none";
  };
  pc.onconnectionstatechange=()=>{if(pc&&pc.connectionState==="failed")$("status").textContent="Connection failed. Press Next."};
  if(initiator)pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>socket.emit("signal",{sdp:pc.localDescription}));
}
socket.on("waiting",()=>{});
socket.on("matched",({initiator})=>{
  matched=true;$("log").innerHTML="";sys("Stranger connected. Say hi! 👋");
  if(mode==="video"){$("status").textContent="Connecting video…";makePC(initiator)}
  else $("status").style.display="none";
});
socket.on("signal",async d=>{
  if(!pc)return;
  try{
    if(d.sdp){
      await pc.setRemoteDescription(d.sdp);
      if(d.sdp.type==="offer"){const a=await pc.createAnswer();await pc.setLocalDescription(a);socket.emit("signal",{sdp:pc.localDescription})}
    }else if(d.candidate)await pc.addIceCandidate(d.candidate);
  }catch(e){console.error(e)}
});
socket.on("partner-left",()=>{sys("Stranger disconnected. Finding a new one…");findNext()});
socket.on("message",t=>{add(t,false);$("typing").textContent=""});
socket.on("typing",v=>{$("typing").textContent=v?"Stranger is typing…":""});

function send(){const t=$("msg").value.trim();if(!t||!matched)return;socket.emit("message",t);add(t,true);$("msg").value="";socket.emit("typing",false)}
$("send").onclick=send;
$("msg").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
$("msg").addEventListener("input",()=>{if(!matched)return;socket.emit("typing",true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>socket.emit("typing",false),1500)});
$("next").onclick=()=>{socket.emit("leave");findNext()};
$("rep").onclick=()=>{if(matched){socket.emit("report");sys("Report sent. Thank you.")}};
$("stop").onclick=()=>{socket.emit("leave");closePC();if(localStream)localStream.getTracks().forEach(t=>t.stop());location.reload()};
</script>
</body>
</html>
